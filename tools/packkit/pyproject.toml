[project]
name = "packkit"
version = "0.1.0"
description = "Builds Genotype Workbench annotation packs: Parquet + manifest, signed index"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=20",
    "cryptography>=45",
    "pyliftover>=0.4",
    "pyfaidx>=0.8",
    "numpy>=2",
    "locus-py",
]

[project.scripts]
packkit = "packkit.cli:main"

[tool.uv.sources]
locus-py = { path = "../../crates/locus-py" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
