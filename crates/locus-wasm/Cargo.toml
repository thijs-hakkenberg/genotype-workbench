[package]
name = "locus-wasm"
description = "WASM bindings for the locus normalizer and the format-profile importer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
locus.workspace = true
genotype-import.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
