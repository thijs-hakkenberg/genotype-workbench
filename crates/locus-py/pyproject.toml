[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "locus-py"
version = "0.1.0"
description = "Python bindings to the locus normalizer, for pack builds"
requires-python = ">=3.10"

[tool.maturin]
python-source = "python"
module-name = "locus_py._locus"
features = ["pyo3/extension-module"]
