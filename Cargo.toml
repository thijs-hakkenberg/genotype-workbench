[workspace]
resolver = "2"
members = ["crates/locus", "crates/genotype-import", "crates/locus-wasm", "crates/locus-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/thijs-hakkenberg/genotype-workbench"

[workspace.dependencies]
locus = { path = "crates/locus" }
genotype-import = { path = "crates/genotype-import" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
